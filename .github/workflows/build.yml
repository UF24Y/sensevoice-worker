name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      # torch + CUDA + 모델까지 들어가 이미지가 크다. 러너 기본 디스크로는
      # 모자라서 안 쓰는 툴체인을 먼저 비운다.
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          sudo rm -rf /usr/local/share/boost "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/sensevoice-worker:latest

      - name: Done
        run: |
          echo "이미지: ghcr.io/${{ steps.owner.outputs.lc }}/sensevoice-worker:latest"
          echo "RunPod 이 pull 하려면 이 패키지를 public 으로 바꿔야 합니다."
